[workspace]
authors = ["zhleiku <302734905@qq.com>"]
channels = ["https://prefix.dev/conda-forge", "conda-forge"]
name = "Foundationpose_for_VR"
platforms = ["win-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.8" # 只声明需要 CUDA，不指定具体小版本

[dependencies]
python = "3.12.*"
cuda-toolkit = "12.8.*"
cmake = ">=4.1.2,<5"
boost = ">=1.82.0,<2"
eigen = ">=3.4.0,<4"
ninja = ">=1.13.1,<2"
psutil = ">=7.1.0,<8"
pybind11 = ">=3.0.1,<4"
mypy = ">=1.18.2,<2"
pyrender = ">=0.1.45,<0.2"
scipy = ">=1.17.0,<2"
libopencv = ">=4.12.0,<5"
opencv = ">=4.12.0,<5"
imageio = ">=2.37.0,<3"
pandas = ">=3.0.0,<4"
h5py = ">=3.15.1,<4"
omegaconf = ">=2.3.0,<3"
transformations = ">=2022.9.26,<2023"
hydra-core = ">=1.3.2,<2"
joblib = ">=1.5.3,<2"
scikit-learn = ">=1.8.0,<2"
pyglet = ">=2.1.13,<3"
ftfy = ">=6.3.1,<7"
regex = ">=2026.1.15,<2027"
iopath = ">=0.1.10,<0.2"
scikit-image = ">=0.26.0,<0.27"
ruamel = ">=1.0,<2"
"ruamel.yaml" = ">=0.19.1,<0.20"
open3d = ">=0.19.0,<0.20"
setuptools = ">=69.0.0,<75"
einops = ">=0.8.2,<0.9"
pycocotools = ">=2.0.11,<3"

[pypi-dependencies]
# PyTorch 全家桶从 PyPI 安装
torch = { version = ">=2.7.1,<2.8", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22,<0.23", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = ">=2.7,<2.8", index = "https://download.pytorch.org/whl/cu128" }
timm = ">=1.0.24, <2"
kornia = ">=0.8.2"
pytorch3d = { version = "==0.7.9+pt2.7.1cu128", index = "https://miropsota.github.io/torch_packages_builder" }
warp-lang = ">=1.11.1, <2"
kaolin = ">=0.1, <0.2"
zmq = ">=0.0.0, <0.0.1"
nvdiffrast = { git = "https://gitcode.com/gh_mirrors/nv/nvdiffrast.git" }
triton-windows = ">=3.6.0.post26, <4"
cutie = { path = "./Cutie", editable = true }
pyrealsense2 = ">=2.56.5,<3"
xatlas = ">=0.0.11, <0.0.12"


[tasks]
fp_demo = { cmd = """
python FoundationPose/run_demo.py
""" }

pose_server = { cmd = """
python -u src/pose_server.py
""" }

pose_server_msvc = { cmd = "python -u src/pose_server.py" }

[tasks.on_demo3] # with sam3
args = [{ arg = "TESTCASE", default = "cube" }]
cmd = """
python src/track_online_demo_with_sam3.py \
--mesh_path                 data/online/{{TESTCASE}}/mesh/{{TESTCASE}}.stl
--pose_output_path          data/online/{{TESTCASE}}/output/pose.npy \
--enable_visualizations     True \
--mask_visualization_path   data/online/{{TESTCASE}}/output/mask_visualization \
--bbox_visualization_path   data/online/{{TESTCASE}}/output/bbox_visualization \
--pose_visualization_path   data/online/{{TESTCASE}}/output/pose_visualization \
--cam_K                     "[[609.454406738281, 0.0, 322.085693359375], [0.0, 608.353942871094, 242.440429687500], [0.0, 0.0, 1.0]]" \  
--apply_scale               1 \
--activate_2d_tracker \  
--force_apply_color \  
--apply_color               "[0, 159, 237]" \
--est_refine_iter           10 \
--text_prompt               "white cube" \
--sam3_confidence_threshold 0.8
"""
